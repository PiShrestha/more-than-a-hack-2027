name: Submission integrity
on:
  push:
    branches: [submission]
  pull_request:
    branches: [submission]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify frozen pipeline and final artifacts
        run: python tools/submission.py verify
      - name: Test release integrity and safe packaging
        run: python -m unittest discover -s tests -v
      - name: Verify upload filenames
        run: python tools/submission.py package --output-dir dist/encara_messi
